<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <input type="text" id="password">
    <p id="hint"></p>
    <p id="text" style="color: red;">Strength : weak </p>

    <script>
       const password = document.getElementById("password")
       const hint = document.getElementById("hint")
       const text = document.getElementById("text");
       password.addEventListener("input",()=>{
       const pass = password.value;
            if(pass.length<=4){
                hint.textContent = "needs 4 plus charecters"
                hint.style.color = "yellow"
            }else{
                hint.textContent = ""
                text.textContent = "Strength : medium"
                text.style.color = "yellow"
            }
            if(!/[A-Z]/.test(pass)){
                hint.textContent = "need a capital letter"
                hint.style.color = "red"
            }
            if(!/[0-9]/.test(pass)){
               hint.textContent = "need a number"
                hint.style.color = "red" 
            }else{
                text.textContent = "strength:strong"
                text.style.color = "green"
            }

       })

    </script>
</body>
</html>
