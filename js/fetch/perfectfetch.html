<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <input type="text"  id="userid" placeholder="enter numbers from 1- 10 ">
    <button onclick="fetchUser()">fetchUser</button>
    <p id="loading"></p>

    <div id="output"></div>

    <script>
        const output = document.getElementById("output")
        const loading = document.getElementById("loading")
        const fetchData = async function(userid){
           try{
             const response = await fetch(`https://jsonplaceholder.typicode.com/users/${userid}`)
            const data = await response.json();
            console.log(data)
            output.innerHTML = `${data.name}----${data.email}`
           }catch{
            console.log("data fetch unsuccessful")
           }
        }
        const fetchUser = ()=>{
            try{
                const userid = document.getElementById("userid").value;
                console.log(userid)
                fetchData(userid)
            }catch{
                console.log("404 UserId not found")
            }

        }
    </script>
</body>
</html>
