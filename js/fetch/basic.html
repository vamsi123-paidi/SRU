<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
        #main{
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }
        #user{
            background:darkkhaki;
            color: lightskyblue;
            height: 400px;
            width: 400px;
            border-radius: 8px;
            box-shadow: 2px 2px 3px rgba(57, 57, 57, 0.161);
        }
    </style>
  </head>
  <body>
    <h1>check the console for an output</h1>
    <div id="main">
        
    </div>
    <script>
      const fetchData = async () => {
        const main = document.getElementById("main");
        const response = await fetch(
          "https://jsonplaceholder.typicode.com/users",
        );
        const data = await response.json();
        console.log(data);
        data.map((user)=>(
            main.innerHTML += ` <div id="user">
            <h1>name : ${user.name}</h1>
            <h1>email : ${user.email}</h1>
        </div> `
        ))
      };
      fetchData();
    </script>
  </body>
</html>
