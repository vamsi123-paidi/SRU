<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .box {
            background-color: lightblue;
            padding: 20px;
            text-align: center;
            display: grid;
            grid-template-columns:200px;    
             gap: 10px;
            
        }
        .item{

            background-color: lightcoral;
            margin: 10px;
            height: 200px;
            width: 200px;
        }
        @media (min-width: 576px) {
            .box {
                background-color: rgb(219, 39, 39);
            }

        }
        @media (min-width: 768px) {
            .box {
                background-color: rgb(196, 229, 49);
                grid-template-columns: repeat(3, 1fr);
            }
        }
        @media (min-width: 992px) {
            .box {
                background-color: rgb(29, 166, 239);
                grid-template-columns: repeat(4, 1fr);
            }
        }
        @media (min-width: 1200px) {
            .box {
                background-color: rgb(249, 226, 50);
                grid-template-columns: repeat(6, 1fr);
            }
        }
    </style>
</head>
<body>
    <div class="box">
        <div class="item"></div>
        <div class="item"></div>
        <div class="item"></div>
        <div class="item"></div>
        <div class="item"></div>
        <div class="item"></div>
    </div>
</body>
</html>
