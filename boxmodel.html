<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .box{
            height:200px;
            width:200px;
            border:2px solid red;
            background:linear-gradient(to right, #ffcccc, #211b1b, #ffcccc);
            padding:10px 10px 10px 10px;
            margin:10px 10px 10px 10px;
        }
        #box{
            height:100px;
            width:200px;
            background:green;
            border-radius:50%;
        }
    </style>
</head>
<body>
    <div>
    <h1>Box Model</h1>
    <p>Box model is a fundamental concept in CSS that describes the rectangular boxes generated for
elements in the document tree and the layout of these boxes. Each box consists of four areas: content, padding, border, and margin.</p>
    <div class="box">Box1</div>
    <div class="box">Box2</div>
    <div class="box">Box3</div>
    <div id="box">

    </div>
    </div>
</body>
</html>
